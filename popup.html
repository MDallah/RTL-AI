<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RTL AI</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --surface: #f6f7f9;
        --accent: #4a8fd9;
        --accent-hover: #357abd;
        --danger: #dc2626;
        --success: #16a34a;
        --focus: #1d4ed8;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f2937;
          --fg: #e5e7eb;
          --muted: #9ca3af;
          --border: #374151;
          --surface: #111827;
          --accent: #4a8fd9;
          --accent-hover: #5b9ee0;
          --danger: #f87171;
          --success: #4ade80;
          --focus: #93c5fd;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 320px;
        margin: 0;
        padding: 14px 16px 16px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        font-size: 14px;
        background: var(--bg);
        color: var(--fg);
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      h1 {
        margin: 0;
        font-size: 16px;
      }

      .switch {
        position: relative;
        width: 42px;
        height: 24px;
        flex: none;
      }

      .switch input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }

      .switch .track {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: #9ca3af;
        transition: background 0.2s ease;
        pointer-events: none;
      }

      .switch .track::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.2s ease;
      }

      .switch input:checked + .track {
        background: var(--accent);
      }

      .switch input:checked + .track::after {
        transform: translateX(18px);
      }

      .switch input:focus-visible + .track {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .section {
        padding: 10px 12px;
        margin-bottom: 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
      }

      .section > .label {
        margin: 0 0 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
      }

      .host {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        word-break: break-all;
      }

      .actions {
        margin-top: 10px;
      }

      .field {
        display: block;
        margin: 8px 0 4px;
        font-size: 13px;
        font-weight: 600;
      }

      .field:first-of-type {
        margin-top: 0;
      }

      input[type="number"],
      input[type="text"],
      select {
        width: 100%;
        padding: 7px 9px;
        font-size: 13px;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      input[type="number"]:focus,
      input[type="text"]:focus,
      select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(74, 143, 217, 0.3);
      }

      button {
        width: 100%;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 700;
        color: #fff;
        background: var(--accent);
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-hover);
      }

      button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      button.secondary {
        color: var(--fg);
        background: transparent;
        border: 1px solid var(--border);
      }

      button.secondary:hover {
        background: transparent;
        border-color: var(--danger);
        color: var(--danger);
      }

      .site-add {
        display: flex;
        gap: 8px;
      }

      .site-add input {
        flex: 1;
      }

      .site-add button {
        width: auto;
        white-space: nowrap;
      }

      .site-list {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
      }

      .site-list li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 8px;
        margin-bottom: 6px;
        font-size: 13px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .site-list li:last-child {
        margin-bottom: 0;
      }

      .site-list .site-empty {
        color: var(--muted);
        justify-content: center;
        background: transparent;
        border-style: dashed;
      }

      .site-list button {
        width: auto;
        padding: 3px 9px;
        font-size: 11px;
        font-weight: 600;
        color: var(--danger);
        background: transparent;
        border: 1px solid var(--border);
      }

      .site-list button:hover {
        background: transparent;
        border-color: var(--danger);
      }

      .note {
        display: block;
        margin: 6px 0 0;
        font-size: 12px;
        min-height: 15px;
      }

      .note.ok {
        color: var(--success);
      }

      .note.err {
        color: var(--danger);
      }

      .muted {
        color: var(--muted);
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>RTL AI</h1>
      <label class="switch" title="Enable or disable everywhere">
        <input type="checkbox" id="enabled" aria-label="Enable RTL AI" />
        <span class="track"></span>
      </label>
    </header>

    <section class="section">
      <p class="label">This site</p>
      <p class="host" id="host">—</p>
      <div class="actions">
        <button id="addCurrent" type="button" hidden>Enable on this site</button>
        <button id="removeCurrent" class="secondary" type="button" hidden>
          Disable on this site
        </button>
      </div>
      <p class="note muted" id="siteNote"></p>
    </section>

    <section class="section">
      <p class="label">Settings</p>
      <label class="field" for="threshold">Detection threshold (%)</label>
      <input type="number" id="threshold" min="0" max="100" step="1" />
      <label class="field" for="buttonPosition">Button position</label>
      <select id="buttonPosition">
        <option value="bottom-right">Bottom right</option>
        <option value="bottom-left">Bottom left</option>
        <option value="top-right">Top right</option>
        <option value="top-left">Top left</option>
      </select>
      <p class="note ok" id="settingsNote"></p>
    </section>

    <section class="section">
      <p class="label">Additional websites</p>
      <div class="site-add">
        <input
          type="text"
          id="siteInput"
          placeholder="example.com"
          spellcheck="false"
          autocomplete="off"
        />
        <button id="addSite" type="button">Add</button>
      </div>
      <span class="note" id="siteListNote"></span>
      <ul id="siteList" class="site-list"></ul>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
